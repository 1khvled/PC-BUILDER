<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate-900 / Slate-950 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bright Emerald Core Glow -->
    <linearGradient id="emeraldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Chip Core Dark Fill -->
    <linearGradient id="chipFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.96" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Central Backlight -->
    <radialGradient id="centralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Rounded Square Container (slate-900 brand) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="22" y="22" width="468" height="468" rx="110" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Ambient Radial Glow in Center -->
  <circle cx="256" cy="256" r="210" fill="url(#centralAura)" />

  <!-- Background Motherboard Grid Lines (Subtle slate traces) -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
    <path d="M56 150 L96 150 L126 180" />
    <path d="M56 362 L96 362 L126 332" />
    <path d="M456 150 L416 150 L386 180" />
    <path d="M456 362 L416 362 L386 332" />
    <path d="M150 56 L150 96 L180 126" />
    <path d="M362 56 L362 96 L332 126" />
    <path d="M150 456 L150 416 L180 386" />
    <path d="M362 456 L362 416 L332 386" />
  </g>
  <g fill="#334155" opacity="0.65">
    <circle cx="56" cy="150" r="3.5" />
    <circle cx="56" cy="362" r="3.5" />
    <circle cx="456" cy="150" r="3.5" />
    <circle cx="456" cy="362" r="3.5" />
    <circle cx="150" cy="56" r="3.5" />
    <circle cx="362" cy="56" r="3.5" />
    <circle cx="150" cy="456" r="3.5" />
    <circle cx="362" cy="456" r="3.5" />
  </g>

  <!-- External Microchip Connector Pins (Radiating out from Hexagon) -->
  <g stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Top Pins -->
    <path d="M256 66 L256 98" />
    <path d="M216 78 L216 108" />
    <path d="M296 78 L296 108" />
    <!-- Bottom Pins -->
    <path d="M256 446 L256 414" />
    <path d="M216 434 L216 404" />
    <path d="M296 434 L296 404" />
    <!-- Left Pins -->
    <path d="M96 256 L126 256" />
    <path d="M106 216 L136 216" />
    <path d="M106 296 L136 296" />
    <!-- Right Pins -->
    <path d="M416 256 L386 256" />
    <path d="M406 216 L376 216" />
    <path d="M406 296 L376 296" />
  </g>
  <!-- Pin Micro Vias / Solder Joints -->
  <g fill="#10b981" opacity="0.85">
    <circle cx="256" cy="66" r="3.5" />
    <circle cx="216" cy="78" r="3" />
    <circle cx="296" cy="78" r="3" />
    <circle cx="256" cy="446" r="3.5" />
    <circle cx="216" cy="434" r="3" />
    <circle cx="296" cy="434" r="3" />
    <circle cx="96" cy="256" r="3.5" />
    <circle cx="106" cy="216" r="3" />
    <circle cx="106" cy="296" r="3" />
    <circle cx="416" cy="256" r="3.5" />
    <circle cx="406" cy="216" r="3" />
    <circle cx="406" cy="296" r="3" />
  </g>

  <!-- Hexagonal Chip Outer Body (Flat-topped regular hexagon: R=155) -->
  <polygon points="178,110 334,110 422,256 334,402 178,402 90,256"
           fill="url(#chipFill)"
           stroke="#1e293b"
           stroke-width="12"
           stroke-linejoin="round" />

  <!-- Glowing Hexagonal Chip Bezel -->
  <polygon points="178,110 334,110 422,256 334,402 178,402 90,256"
           fill="none"
           stroke="url(#emeraldGrad)"
           stroke-width="4.5"
           stroke-linejoin="round"
           filter="url(#emeraldGlow)" />

  <!-- Inner Hexagon Accent Track -->
  <polygon points="188,128 324,128 404,256 324,384 188,384 108,256"
           fill="none"
           stroke="#059669"
           stroke-width="1.5"
           stroke-dasharray="8 5"
           opacity="0.45" />

  <!-- Pin 1 Chip Indicator Notch (Top-left) -->
  <circle cx="152" cy="190" r="4.5" fill="#0f172a" stroke="#34d399" stroke-width="2" />

  <!-- ==================== CIRCUIT TRACES FORMING 'DZ' ==================== -->
  
  <g filter="url(#emeraldGlow)">
    <!-- ====== LETTER 'D' ====== -->
    <!-- Outer Contour of D (45-degree chamfers typical of PCB routing) -->
    <path d="M 166,168 L 216,168 L 246,198 L 246,314 L 216,344 L 166,344 Z"
          fill="none"
          stroke="url(#emeraldBright)"
          stroke-width="14"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Inner D Chamber (Dark core with emerald boundary) -->
    <path d="M 188,198 L 206,198 L 224,216 L 224,296 L 206,314 L 188,314 Z"
          fill="#064e3b"
          fill-opacity="0.35"
          stroke="url(#emeraldGrad)"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- ====== LETTER 'Z' ====== -->
    <!-- Crisp Z Track: Top rail -> 45-degree diagonal -> Bottom rail -->
    <path d="M 266,168 L 344,168 L 266,344 L 344,344"
          fill="none"
          stroke="url(#emeraldBright)"
          stroke-width="14"
          stroke-linejoin="round"
          stroke-linecap="round" />
  </g>

  <!-- Core White Trace Lines (High-intensity neon wire inside DZ) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <!-- D Center Wire -->
    <path d="M 166,168 L 216,168 L 246,198 L 246,314 L 216,344 L 166,344 Z" />
    <!-- Z Center Wire -->
    <path d="M 266,168 L 344,168 L 266,344 L 344,344" />
  </g>

  <!-- Circuit Solder Terminals / Nodes on DZ -->
  <g fill="#ffffff" filter="url(#subtleGlow)">
    <!-- D Solder Pads -->
    <circle cx="166" cy="168" r="4.5" />
    <circle cx="166" cy="344" r="4.5" />
    <circle cx="166" cy="256" r="4.5" />

    <!-- Z Solder Pads -->
    <circle cx="266" cy="168" r="4.5" />
    <circle cx="344" cy="168" r="4.5" />
    <circle cx="266" cy="344" r="4.5" />
    <circle cx="344" cy="344" r="4.5" />
    <circle cx="305" cy="256" r="4" />
  </g>

  <!-- Horizontal Data Bus Interconnect Traces (Wiring DZ into the Chip) -->
  <g stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <!-- Left bus: from D spine to left via -->
    <path d="M 166,256 L 128,256" />

    <!-- Center bus: from D outer edge across to Z diagonal node -->
    <path d="M 246,256 L 270,256 L 305,256" stroke-dasharray="4 3" />

    <!-- Right bus: from Z diagonal node to right via -->
    <path d="M 305,256 L 382,256" />

    <!-- Top & Bottom vertical traces from D -->
    <path d="M 190,168 L 190,140 L 206,124" />
    <path d="M 190,344 L 190,372 L 206,388" />

    <!-- Top & Bottom vertical traces from Z -->
    <path d="M 320,168 L 320,140 L 304,124" />
    <path d="M 290,344 L 290,372 L 306,388" />
  </g>

  <!-- Chip Vias (Emerald annular rings with dark centers) -->
  <g fill="#07111e" stroke="#34d399" stroke-width="2">
    <circle cx="128" cy="256" r="5" />
    <circle cx="382" cy="256" r="5" />
    <circle cx="206" cy="124" r="4.5" />
    <circle cx="304" cy="124" r="4.5" />
    <circle cx="206" cy="388" r="4.5" />
    <circle cx="306" cy="388" r="4.5" />
    <!-- Center via inside D loop -->
    <circle cx="206" cy="256" r="4.5" />
  </g>
  <!-- Via Bright Center Cores -->
  <g fill="#a7f3d0">
    <circle cx="128" cy="256" r="1.8" />
    <circle cx="382" cy="256" r="1.8" />
    <circle cx="206" cy="124" r="1.6" />
    <circle cx="304" cy="124" r="1.6" />
    <circle cx="206" cy="388" r="1.6" />
    <circle cx="306" cy="388" r="1.6" />
    <circle cx="206" cy="256" r="1.6" />
  </g>
</svg>