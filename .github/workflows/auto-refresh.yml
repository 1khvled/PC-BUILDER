name: Market Scraper & Supabase Auto-Refresh

on:
  schedule:
    # Runs every 2 days at 04:00 UTC (05:00 AM Algiers time)
    - cron: '0 4 */2 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync regardless of freshness'
        required: false
        type: boolean
        default: false

concurrency:
  group: auto-refresh-sync
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Market Store Scrapers & Ouedkniss Resweep
        run: |
          echo "Sweeping Algerian hardware stores and standalone shops..."
          node scripts/scrape-woo-stores.cjs || true
          node scripts/scrape-more-stores.cjs || true
          echo "Resweeping Ouedkniss stores and pruning deleted/stale offers..."
          node scripts/resweep-and-prune.cjs --seed-only || true

      - name: Bake Scraped Catalog
        run: |
          echo "Baking fresh catalog data into live.ts and supabase-seed.json..."
          node bake.cjs

      - name: Run Smart Delta Sync (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node scripts/smart-sync.mjs --force
          else
            node scripts/smart-sync.mjs
          fi

      - name: Check for file changes
        id: git_status
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push updated catalog (if changed)
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase-seed.json lib/data/live.ts lib/data/live-images.ts full.json || true
          git commit -m "chore(data): auto-update catalog & seed [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin main

